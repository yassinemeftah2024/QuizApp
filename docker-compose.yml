services:
  # ============================
  # 1. Database Service (Postgres)
  # ============================
  db:
    image: postgres:16-alpine
    container_name: quizapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizapp}
      POSTGRES_USER: ${POSTGRES_USER:-quizapp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizapp_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizapp_user} -d ${POSTGRES_DB:-quizapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # 2. Backend Service (Spring Boot)
  # ============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizapp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-quizapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quizapp_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quizapp_secret}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_quizapp_2026_secure}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quizapp-network

  # ============================
  # 3. Frontend Service (React / Nginx)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizapp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quizapp-network

volumes:
  postgres_data:

networks:
  quizapp-network:
    driver: bridge
